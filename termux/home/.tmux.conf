# ==========================================================================
# tmux.conf — mirrors wezterm multiplexing workflow
#
# Prefix:       Ctrl+Space
# Splits:       prefix+v (vertical), prefix+b (horizontal)
# Navigate:     prefix+hjkl
# Zoom:         prefix+f
# Resize mode:  prefix+r, then hjkl (repeatable)
# Windows:      Ctrl+t (new), Ctrl+w (kill pane), Ctrl+1..9 (select)
# ==========================================================================

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------

# True color + 256 color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Larger scrollback
set -g history-limit 50000

# Faster escape (important for neovim)
set -sg escape-time 10

# Enable focus events (for neovim autoread, etc.)
set -g focus-events on

# Start window/pane numbering at 1 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Mouse support (essential on Termux / phone)
set -g mouse on

# Vi mode
set -g status-keys vi
set -g mode-keys vi

# ---------------------------------------------------------------------------
# Prefix: Ctrl+Space (matches wezterm leader)
# ---------------------------------------------------------------------------

set -g prefix C-Space
bind C-Space send-prefix

# ---------------------------------------------------------------------------
# No-prefix bindings (matches wezterm non-leader keys)
# ---------------------------------------------------------------------------

# Ctrl+t — new window (like wezterm Ctrl+t)
bind -n C-t new-window -c "#{pane_current_path}"

# Ctrl+w — kill pane (like wezterm Ctrl+w)
bind -n C-w kill-pane

# Ctrl+1..9 — select windows (like wezterm Ctrl+1..9)
bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5
bind -n C-6 select-window -t 6
bind -n C-7 select-window -t 7
bind -n C-8 select-window -t 8
bind -n C-9 select-window -t 9

# ---------------------------------------------------------------------------
# Prefixed bindings (after Ctrl+Space)
# ---------------------------------------------------------------------------

# Splits — v for vertical, b for horizontal (matching wezterm)
# tmux -h splits the pane with a vertical line (left/right)
# tmux -v splits the pane with a horizontal line (top/bottom)
bind v split-window -h -c "#{pane_current_path}"
bind b split-window -v -c "#{pane_current_path}"

# Pane navigation — hjkl (matching wezterm prefix+hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Arrow key alternatives
bind Up    select-pane -U
bind Down  select-pane -D
bind Left  select-pane -L
bind Right select-pane -R

# Zoom toggle — prefix+f (matching wezterm prefix+f)
bind f resize-pane -Z

# Reload config — prefix+Shift+C (matching wezterm prefix+Shift+C)
bind C source-file ~/.tmux.conf \; display "Config reloaded"

# ---------------------------------------------------------------------------
# Resize mode — prefix+r, then hjkl (repeatable, matching wezterm)
# ---------------------------------------------------------------------------

bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# prefix+r enters a pseudo "resize mode" by just reminding you of Alt+hjkl
# (tmux doesn't have key tables like wezterm, but -r flag makes keys repeatable)
bind r display "Resize: Alt+h/j/k/l (repeatable)"

# ---------------------------------------------------------------------------
# Copy mode (vi-style, matching wezterm scroll behavior)
# ---------------------------------------------------------------------------

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Scroll: prefix+[ enters copy mode, then use vi keys
# Half-page scroll shortcuts (like wezterm Ctrl+e/Ctrl+d)
bind -T copy-mode-vi C-u send -X halfpage-up
bind -T copy-mode-vi C-d send -X halfpage-down

# ---------------------------------------------------------------------------
# Status bar — minimal, informative
# ---------------------------------------------------------------------------

set -g status-position bottom
set -g status-interval 5

# Colors (inspired by your wezterm M365Princess theme)
set -g status-style "bg=#1a1a2e,fg=#86BBD8"

# Left: session name
set -g status-left-length 30
set -g status-left "#[bg=#047E84,fg=#FFFFFF,bold] #S #[bg=default] "

# Right: date/time
set -g status-right-length 50
set -g status-right "#[bg=#33658A,fg=#FFFFFF] %H:%M #[bg=#047E84,fg=#FFFFFF,bold] %Y-%m-%d "

# Window tabs
setw -g window-status-format "#[fg=#86BBD8] #I:#W "
setw -g window-status-current-format "#[bg=#33658A,fg=#FFFFFF,bold] #I:#W#{?window_zoomed_flag, [f],} "

# Pane borders
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#047E84"

# Messages
set -g message-style "bg=#DA627D,fg=#FFFFFF,bold"
