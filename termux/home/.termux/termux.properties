# Termux properties
# Changes take effect after: termux-reload-settings

# Extra keys row — provides ESC, CTRL, and navigation keys that are
# awkward to type on a phone keyboard. Two rows for comfort.
extra-keys = [ \
  ['ESC', 'CTRL', 'ALT', 'TAB', 'HOME', 'UP', 'END', 'PGUP'], \
  ['~', '/', '-', '|', 'LEFT', 'DOWN', 'RIGHT', 'PGDN'] \
]

# Use black color scheme (matches wezterm background)
use-black-ui = true

# Bell: vibrate instead of beeping
bell-character = vibrate

# Handle the back key as escape (useful for vim/tmux)
back-key = escape

# Allow external applications to open URLs
allow-external-apps = true

# Fullscreen mode (uncomment if you want it)
# fullscreen = true

# Margin between content and extra-keys (dp)
# extra-keys-style = default
